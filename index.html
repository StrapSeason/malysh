<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6efe6">
<meta name="description" content="Дневник малыша: кормления, сон, подгузники и белый шум">
<title>Малыш</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,300..600&family=Onest:wght@400..700&display=swap">
<link rel="stylesheet" href="styles.css?v=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
  // Тема до первой отрисовки, чтобы ночью не мигнуть белым
  (function () {
    var t = 'auto';
    try { t = (JSON.parse(localStorage.getItem('malysh.v1') || '{}').s || {}).theme || 'auto'; } catch (e) {}
    var w = window.Telegram && window.Telegram.WebApp;
    if (t === 'auto') t = w && w.initData ? (w.colorScheme === 'dark' ? 'dark' : 'light')
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main id="app" class="app"></main>
<nav id="nav" class="nav" aria-label="Разделы" hidden><div class="nav-in" id="nav-in"></div></nav>
<div id="sheet-root" class="sheet-root" hidden>
  <div class="scrim" data-act="sheet-close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab" aria-hidden="true"></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=1"></script>
</body>
</html>
